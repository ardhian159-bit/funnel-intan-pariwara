        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            opacity: 0;
            animation: fadeIn .8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes sectionFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-fade-in {
            animation: sectionFadeIn 0.25s ease forwards;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;

        .badge {
            padding: .25rem .5rem;
            border-radius: 9999px;
            font-size: .75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: .25rem;
        }

        .badge-deal {
            background: rgba(34, 197, 94, .2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, .5);
        }

        .badge-closing {
            background: rgba(132, 204, 22, .2);
            color: #a3e635;
            border: 1px solid rgba(132, 204, 22, .5);
        }

        .badge-pitching {
            background: rgba(234, 179, 8, .2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, .5);
        }

        .badge-shortlisted {
            background: rgba(249, 115, 22, .2);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, .5);
        }

        .badge-pendekatan {
            background: rgba(239, 68, 68, .2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .badge-dead {
            background: rgba(100, 116, 139, .2);
            color: #94a3b8;
            text-decoration: line-through;
            border: 1px solid rgba(100, 116, 139, .5);
        }

        .badge-100 {
            background: rgba(34, 197, 94, .2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, .5);
        }

        .badge-75 {
            background: rgba(132, 204, 22, .2);
            color: #a3e635;
            border: 1px solid rgba(132, 204, 22, .5);
        }

        .badge-50 {
            background: rgba(234, 179, 8, .2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, .5);
        }

        .badge-25 {
            background: rgba(249, 115, 22, .2);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, .5);
        }

        .badge-10 {
            background: rgba(239, 68, 68, .2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .badge-5 {
            background: rgba(239, 68, 68, .2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: .75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .1);
            transition: transform .2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .2);
            border-color: #475569;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            font-size: .875rem;
            border-radius: .5rem;
            padding: .625rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 2px rgba(20, 184, 166, .3);
        }

        .nav-btn {
            padding: .5rem 1rem;
            border-radius: .5rem;
            font-size: .875rem;
            font-weight: 600;
            transition: all .2s;
            cursor: pointer;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
        }

        .nav-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #0d9488, #0ea5e9);
            color: white;
            border-color: transparent;
        }

        .status-row-deal {
            background: rgba(34, 197, 94, .05);
        }

        .status-row-closing {
            background: rgba(132, 204, 22, .05);
        }

        .status-row-pitching {
            background: rgba(234, 179, 8, .05);
        }

        .status-row-shortlisted {
            background: rgba(249, 115, 22, .05);
        }

        .status-row-pendekatan {
            background: rgba(239, 68, 68, .05);
        }

        .status-row-dead {
            background: rgba(100, 116, 139, .05);
            opacity: .7;
        }

        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: .75rem;
            font-weight: 600;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform .4s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            background: #065f46;
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .toast-error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .project-item {
            padding: .75rem 1rem;
            border: 1px solid #334155;
            border-radius: .5rem;
            cursor: pointer;
            transition: all .2s;
            background: #1e293b;
        }

        .project-item:hover {
            border-color: #14b8a6;
            background: #1e293b;
        }

        .project-item.selected {
            border-color: #14b8a6;
            background: rgba(20, 184, 166, .1);
        }

        .field-error {
            border-color: #ef4444 !important;
        }

        .error-msg {
            color: #f87171;
            font-size: .75rem;
            margin-top: .25rem;
            display: none;
        }

        @media(max-width:768px) {
            .nav-btn {
                font-size: .75rem;
                padding: .375rem .75rem;
            }
        }

        .filter-btn {
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* Custom Dropdown CSS */
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }

        .custom-select {
            position: relative;
            display: flex;
            flex-direction: column;
            border-width: 0;
            padding: 0;
            cursor: pointer;
        }

        .custom-select__trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .625rem;
            font-size: .875rem;
            color: white;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: .5rem;
        }

        .custom-options {
            position: absolute;
            display: block;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid #334155;
            border-top: 0;
            background: #1e293b;
            transition: all 0.3s;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 50;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 0 0 0.5rem 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            border-top: 1px solid #334155;
        }

        .custom-option {
            position: relative;
            display: block;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            border-bottom: 1px solid #334155;
        }

        .custom-option:hover {
            background-color: #334155;
        }

        .custom-option.selected {
            color: #14b8a6;
            background-color: #0f172a;
        }

        .custom-search {
            padding: 0.5rem;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            background: #1e293b;
            z-index: 2;
        }

        .custom-search input {
            width: 100%;
            padding: 0.375rem;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 0.25rem;
            font-size: 0.8rem;
        }

        .custom-search input:focus {
            outline: none;
            border-color: #14b8a6;
        }

        /* Modal CSS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            transform: translateY(-20px);
            transition: transform 0.3s;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        var sumberDanaList = ['APBN', 'APBD', 'DAK', 'BOS', 'BLUD', 'BUMD', 'POKIR', 'APBDP', 'Swasta'];
        var jenisProdukList = ['Mebel / Furnitur', 'Alat Tulis Kantor', 'TIK & Periperal', 'Buku Non Teks HET', 'Buku Teks Pendamping HET', 'Buku Teks Pendamping', 'Buku Non Teks', 'Buku PAUD', 'Cetak, Kertas, dan Buku Tulis', 'Alat Olahraga', 'Alat Kesehatan / Kebersihan', 'Alat Praktik', 'Alat Praktik SMK', 'Alat Peraga APE Luar', 'Alat Peraga APE Dalam', 'Alat Peraga LAB IPA', 'Pakaian dan Seragam', 'Elektronik', 'Paket Project'];
        var statusList = ['Gagal', 'Informasi Awal', 'Informasi Kebutuhan', 'Presentasi', 'Peluang 50:50', 'Hot Prospek', 'Closing'];
        var tkValues = ['5%', '10%', '25%', '50%', '75%', '100%'];

        // ============================================================
        // SECTION B: STATE MANAGEMENT & AUTH
        // ============================================================

        var currentSession = { role: null, username: null }; // null = not logged in (sales)
        var currentRole = null;
        var currentMenu = 'update'; // Default landing page
        var currentSalesUser = '';
        var monitoringSortKey = 'timestamp';
        var monitoringSortAsc = false;
        var currentPage = 1;

        // REGION_DATA & provinsiList → lihat assets/region-data.js
        // utility functions → lihat assets/utils.js

        // ============================================================
        // SECTION C: MOCK FUNNEL DATA (from Excel - 15 real entries)
        // ============================================================
        var funnelData = [];

        // ============================================================
        // SECTION D: MOCK WEEKLY UPDATES (20+ entries across W8-W10)
        // ============================================================
        var weeklyUpdates = [];

        // ============================================================
        // SECTION E: UTILITY FUNCTIONS
        // ============================================================
        // utility functions → lihat assets/utils.js
        var today = new Date();
        var currentWeek = getISOWeek(today);
        var currentYear = 2026;
        var currentWeekLabel = `W${currentWeek}-${currentYear}`;
        // auth functions → lihat assets/auth.js
        function getVisibleUpdates() {
            if (canSeeAllData()) return weeklyUpdates;
            return weeklyUpdates.filter(u => u.pic === currentSalesUser);
        }
        async function loadPipelineData() {
            if (CONFIG.USE_MOCK_DATA) return funnelData;
            try {
                showLoadingState(true);
                const sess = JSON.parse(sessionStorage.getItem('ip_session') || '{}');
                const data = await apiGet('getLeads', { role: sess.role || '', username: sess.username || '' });
                // Normalize Sheets data to match local format
                funnelData = data.map(d => ({
                    ...d,
                    id: d.id || d.no || 0,
                    tk: (typeof d.tk === 'number' && d.tk > 0 && d.tk <= 1) ? Math.round(d.tk * 100) : (parseInt(d.tk) || 0),
                    nilaiAnggaran: Number(d.nilaiAnggaran) || 0,
                    forecastNetto: Number(d.forecastNetto) || 0
                }));
                return funnelData;
            } catch (err) {
                showToast('Gagal memuat data: ' + err.message, 'error');
                return funnelData; // fallback to mock
            } finally {
                showLoadingState(false);
            }
        }

        async function loadTrackerData() {
            if (CONFIG.USE_MOCK_DATA) return weeklyUpdates;
            try {
                showLoadingState(true);
                const data = await apiGet('getTrackers');
                // Map Sheets fields to local weeklyUpdates format
                weeklyUpdates = data.map((d, i) => ({
                    id: d.id || (i + 1),
                    projectId: d.funnelId || '',
                    funnelId: d.funnelId || '',
                    pic: d.pic || '',
                    namaPaket: d.namaPaket || '',
                    week: d.week || '',
                    status: d.statusBaru || '',
                    forecast: d.forecastNetto || 0,
                    notes: d.notes || '',
                    adminNotes: d.adminNotes || '',
                    timestamp: d.timestamp || ''
                }));
                return weeklyUpdates;
            } catch (err) {
                showToast('Gagal memuat data tracker: ' + err.message, 'error');
                return weeklyUpdates; // fallback
            } finally {
                showLoadingState(false);
            }
        }

// ============================================================
        // SECTION F: NAVIGATION & ROLE SYSTEM
        // ============================================================
        // ===== AUTH LOGIC =====
        // auth functions → lihat assets/auth.js

        // ===== CUSTOM DROPDOWNS LOGIC =====
        document.addEventListener('click', e => {
            if (!e.target.closest('.custom-select-wrapper')) {
                document.querySelectorAll('.custom-options.open, .custom-select.open').forEach(el => el.classList.remove('open'));
            }
        });

        // ============================================================
        // SECTION G: INPUT FUNNEL LOGIC
        // ============================================================

        // ============================================================
        // SECTION H: UPDATE FUNNEL LOGIC
        // ============================================================
// ============================================================
        // SECTION I: DASHBOARD RENDERING & CHARTS
        // ============================================================
        let chartInstances = {};
        let currentFilters = { quarter: 'ALL', sumberDana: 'ALL', tk: 'ALL', pic: 'ALL', provinsi: 'ALL' };
        let filtersPopulated = false;






        // ============================================================
        // SECTION J: MONITORING TABLE
        // ============================================================
        let lastFilterState = '';
        function repopulateMonFilterFunnel() {
            const salesVal = document.getElementById('mon-filter-sales')?.value || '';
            const funnelSel = document.getElementById('mon-filter-funnel');
            if (!funnelSel) return;
            const filtered = (salesVal && salesVal !== 'ALL')
                ? weeklyUpdates.filter(u => (u.pic || '').toLowerCase() === salesVal.toLowerCase())
                : weeklyUpdates;
            const ids = [...new Set(filtered.map(u => u.funnelId).filter(Boolean))].sort();
            funnelSel.innerHTML = '<option value="">Semua Funnel</option>' +
                ids.map(id => `<option value="${id}">${id}</option>`).join('');
            funnelSel.value = '';
            renderMonitoring();
        }
        function populateMonitoringFilters() {
            const salesFil = document.getElementById('mon-filter-sales');
            if (!salesFil) return;
            const uniqueSales = [...new Set(getVisibleUpdates().map(u => u.pic))];
            salesFil.innerHTML = '<option value="ALL">Semua Sales</option>';
            uniqueSales.forEach(s => {
                const o = document.createElement('option'); o.value = s; o.textContent = s;
                salesFil.appendChild(o);
            });
            if (canSeeAllData()) {
                salesFil.value = 'ALL';
            } else if (uniqueSales.includes(currentSalesUser)) {
                salesFil.value = currentSalesUser;
            }
            const weekFil = document.getElementById('mon-filter-week');
            const uniqueWeeks = [...new Set(weeklyUpdates.map(u => u.week))].sort();
            weekFil.innerHTML = '<option value="ALL">Semua Week</option>';
            uniqueWeeks.forEach(w => {
                const o = document.createElement('option'); o.value = w; o.textContent = w; weekFil.appendChild(o);
            });
            repopulateMonFilterFunnel();
        }
        function renderMonitoring() {
            const tbody = document.getElementById('monitoring-tbody');
            if (!tbody) return;
            let data = getVisibleUpdates();
            const sf = document.getElementById('mon-filter-sales')?.value;
            const wf = document.getElementById('mon-filter-week')?.value;
            const stf = document.getElementById('mon-filter-status')?.value;
            const qf = document.getElementById('mon-filter-quarter')?.value;
            const ff = document.getElementById('mon-filter-funnel')?.value || '';

            const currentFilterState = sf + wf + stf + qf + ff;
            if (lastFilterState !== currentFilterState) {
                currentPage = 1;
                lastFilterState = currentFilterState;
            }

            data = data.filter(u => !sf || sf === 'ALL' || u.pic === sf);
            data = data.filter(u => !wf || wf === 'ALL' || u.week === wf);
            data = data.filter(u => !stf || stf === 'ALL' || u.status === stf);
            data = data.filter(u => !ff || ff === 'ALL' || u.funnelId === ff);
            if (qf && qf !== 'ALL') {
                const projectIds = funnelData.filter(f => f.quarter === qf).map(f => f.id);
                const funnelIds = funnelData.filter(f => f.quarter === qf).map(f => f.funnelId);
                data = data.filter(u => projectIds.includes(u.projectId) || funnelIds.includes(u.funnelId) || funnelIds.includes(u.projectId));
            }
            // Sort
            data.sort((a, b) => {
                let va = a[monitoringSortKey], vb = b[monitoringSortKey];
                if (monitoringSortKey === 'forecast') { va = a.forecast; vb = b.forecast; }
                if (monitoringSortKey === 'sales') { va = a.pic; vb = b.pic; }
                if (monitoringSortKey === 'project') {
                    const pa = funnelData.find(f => f.id === a.projectId);
                    const pb = funnelData.find(f => f.id === b.projectId);
                    va = pa ? pa.namaPaket : ''; vb = pb ? pb.namaPaket : '';
                }
                if (monitoringSortKey === 'id') {
                    const pa = funnelData.find(f => f.id === a.projectId);
                    const pb = funnelData.find(f => f.id === b.projectId);
                    va = pa ? (pa.funnelId || '') : ''; vb = pb ? (pb.funnelId || '') : '';
                }
                if (typeof va === 'string') va = va.toLowerCase();
                if (typeof vb === 'string') vb = vb.toLowerCase();
                if (va < vb) return monitoringSortAsc ? -1 : 1; if (va > vb) return monitoringSortAsc ? 1 : -1;
                return 0;
            });
            const showActions = canDelete();
            document.getElementById('mon-action-col').style.display = showActions ? '' : 'none';

            const totalEntries = data.length;
            const totalPages = Math.ceil(totalEntries / ITEMS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalEntries);
            const pagedData = data.slice(startIdx, endIdx);

            tbody.innerHTML = pagedData.map(u => {
                const project = funnelData.find(f => f.funnelId === u.funnelId || f.funnelId === u.projectId || f.id === u.projectId) || {};
                return `<tr class="${getStatusRowClass(u.status)} hover:bg-slate-700/30 cursor-pointer"
                        onclick="openDetailModal(${u.id})">
        <td class="px-3 py-2.5 font-medium text-teal-400 font-mono text-xs">${u.funnelId || u.projectId || '-'}</td>
        <td class="px-3 py-2.5 font-medium">${u.week}</td>
        <td class="px-3 py-2.5">${u.pic}</td>
        <td class="px-4 py-2.5">${project.namaPaket || u.namaPaket || '-'}</td>
        <td class="px-3 py-2.5"><span class="badge ${getStatusBadgeClass(u.status)}">${u.status}</span></td>
        <td class="px-3 py-2.5 text-right text-teal-400 font-semibold">${fmtRp(u.forecast)}</td>
        <td class="px-4 py-2.5 text-xs max-w-[200px] truncate" title="${u.notes}">${u.notes || '-'}</td>
        <td class="px-4 py-2.5 text-xs text-teal-300 max-w-[200px] truncate" title="${u.adminNotes}">
            ${u.adminNotes || '-'}</td>
        <td class="px-3 py-2.5 text-xs text-slate-500">${u.timestamp}</td>
        <td class="px-3 py-2.5 text-center" style="${showActions ? '' : 'display:none'}">${showActions ? `<button
                onclick="event.stopPropagation(); deleteUpdate(${u.id})"
                class="text-red-400 hover:text-red-300 text-xs font-bold">🗑️</button>`: ''}</td>
    </tr>`;
            }).join('');

            document.getElementById('monitoring-info').textContent = totalEntries > 0 ? `Menampilkan ${startIdx + 1}–${endIdx} dari ${totalEntries} entri` : 'Menampilkan 0 entri';
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pag = document.getElementById('monitoring-pagination');
            if (!pag) return;
            let html = `<button class="px-3 py-1.5 hover:bg-slate-700 border-r border-slate-700 disabled:opacity-50" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="px-3 py-1.5 border-r border-slate-700 ${i === currentPage ? 'bg-teal-600 font-bold' : 'hover:bg-slate-700'}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span class="px-2 py-1.5 opacity-50 border-r border-slate-700">...</span>`;
                }
            }
            html += `<button class="px-3 py-1.5 hover:bg-slate-700 disabled:opacity-50" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
            pag.innerHTML = html;
        }

        function goToPage(p) {
            currentPage = p;
            renderMonitoring();
        }
        function sortMonitoring(key) {
            if (monitoringSortKey === key) monitoringSortAsc = !monitoringSortAsc;
            else { monitoringSortKey = key; monitoringSortAsc = true; }
            renderMonitoring();
        }
        function deleteUpdate(id) {
            if (!canDelete()) { showToast('Tidak punya akses untuk menghapus!', 'error'); return; }
            weeklyUpdates = weeklyUpdates.filter(u => u.id !== id);
            logActivity('Deleted weekly update ID ' + id);
            showToast('Data berhasil dihapus');
            renderMonitoring();
        }

        var detailCurrentId = null;

        function openDetailModal(id) {
            const u = weeklyUpdates.find(w => w.id === id);
            if (!u) return;
            const project = funnelData.find(f => f.funnelId === u.funnelId || f.funnelId === u.projectId || f.id === u.projectId) || {};
            detailCurrentId = id;

            document.getElementById('detail-modal-body').innerHTML = `
                <div class="grid grid-cols-2 gap-3">
                    <div><span class="text-slate-500 text-xs uppercase">Funnel ID</span>
                        <p class="text-teal-400 font-mono font-bold">${u.funnelId || u.projectId || '-'}</p></div>
                    <div><span class="text-slate-500 text-xs uppercase">Week</span>
                        <p class="text-white font-semibold">${u.week}</p></div>
                    <div><span class="text-slate-500 text-xs uppercase">Sales</span>
                        <p class="text-white">${u.pic}</p></div>
                    <div><span class="text-slate-500 text-xs uppercase">Status</span>
                        <p><span class="badge ${getStatusBadgeClass(u.status)}">${u.status}</span></p></div>
                    <div class="col-span-2"><span class="text-slate-500 text-xs uppercase">Nama Project</span>
                        <p class="text-white">${project.namaPaket || u.namaPaket || '-'}</p></div>
                    <div><span class="text-slate-500 text-xs uppercase">Nilai Forecast</span>
                        <p class="text-teal-400 font-semibold">${fmtRp(u.forecast)}</p></div>
                    <div><span class="text-slate-500 text-xs uppercase">Principal</span>
                        <p class="text-white">${project.principal || '-'}</p></div>
                    <div class="col-span-2"><span class="text-slate-500 text-xs uppercase">Notes dari Sales</span>
                        <p class="text-slate-300 bg-slate-800 rounded p-2 mt-1">${u.notes || '-'}</p></div>
                </div>`;

            document.getElementById('detail-admin-notes').value = u.adminNotes || '';
            document.getElementById('detail-modal').classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('open');
            detailCurrentId = null;
        }

        async function saveAdminNotes() {
            if (!detailCurrentId) return;
            const u = weeklyUpdates.find(w => w.id === detailCurrentId);
            if (!u) return;
            const notes = document.getElementById('detail-admin-notes').value;
            try {
                await apiPost('updateTracker', {
                    funnelId: u.funnelId || u.projectId,
                    week: u.week,
                    pic: u.pic,
                    statusBaru: u.status,
                    forecastNetto: u.forecast,
                    notes: u.notes,
                    adminNotes: notes
                });
                u.adminNotes = notes;
                showToast('✅ Admin notes berhasil disimpan', 'success');
                closeDetailModal();
                renderMonitoring();
            } catch(err) {
                showToast('Gagal simpan: ' + err.message, 'error');
            }
        }

        function exportData() {
            if (!canExportCSV()) {
                showToast('Hanya Superadmin yang bisa export CSV!', 'error');
                return;
            }
            exportCSV();
        }

        // ============================================================
        // SECTION K: CONTROL PANEL (Super Admin)
        // ============================================================
        // ============================================================
        // USER MANAGEMENT
        // ============================================================
        var umSelectedUser = null;

        function exportCSV() {
            if (!weeklyUpdates.length) { showToast('Tidak ada data update untuk diexport', 'error'); return; }
            const headers = ['ID Update', 'Week', 'PIC', 'ID Project', 'Nama Paket', 'Instansi', 'Principal', 'Status', 'Forecast Netto', 'Notes Sales', 'Admin Notes', 'Timestamp'];
            const rows = [headers.join(',')];
            weeklyUpdates.forEach(u => {
                const p = funnelData.find(f => f.funnelId === u.funnelId || f.funnelId === u.projectId || f.id === u.projectId) || {};
                const row = [
                    u.id, u.week, `"${u.pic}"`, u.funnelId || u.projectId, `"${p.namaPaket || u.namaPaket || ''}"`, `"${p.instansi || ''}"`, `"${p.principal || ''}"`,
                    u.status, u.forecast, `"${(u.notes || '').replace(/"/g, '""')}"`, `"${(u.adminNotes || '').replace(/"/g, '""')}"`, `"${u.timestamp}"`
                ];
                rows.push(row.join(','));
            });
            const csv = rows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'tracker-export.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            logActivity('Exported weekly updates to CSV');
            showToast('✅ Download CSV dimulai');
        }

        // ============================================================
        // SECTION L: INITIALIZATION
        // ============================================================

        async function init() {
            if (!sessionStorage.getItem('ip_session')) {
                window.location.href = 'admin.html';
                return;
            }
            // Warmup Apps Script — eliminasi cold start
            apiGet('ping').catch(function () { });
            // Restore session dari sessionStorage (misal: back dari dashboard.html)
            const savedSession = sessionStorage.getItem('ip_session');
            if (savedSession) {
                try {
                    const parsed = JSON.parse(savedSession);
                    currentSession = parsed;
                    currentRole = parsed.role;
                } catch (e) {
                    sessionStorage.removeItem('ip_session');
                }
            }
            // Guard: harus login dulu
            if (!currentRole) {
                window.location.href = 'admin.html';
                return;
            }
            // Sales tidak boleh akses prototype
            if (currentRole === 'sales') {
                window.location.href = 'sales.html';
                return;
            }

            // Show connection status indicator
            updateConnectionStatus();

            // If live, clear mock data and load from Sheets
            try {
                const settings = await apiGet('getSettings');
                if (settings.picNames?.length) picNames = settings.picNames;
                if (settings.principals?.length) principals = settings.principals;
                if (settings.sumberDana?.length) sumberDanaList = settings.sumberDana;
            } catch (e) {
                console.warn('Gagal load settings:', e);
            }
            if (!CONFIG.USE_MOCK_DATA) {
                weeklyUpdates = [];
                funnelData = [];
                try {
                    await loadPipelineData();
                    await loadTrackerData();
                } catch (err) {
                    showToast('Gagal memuat data awal: ' + err.message, 'error');
                }
            }

            // Backfill mock Funnel IDs
            funnelData.forEach(f => {
                if (!f.funnelId) f.funnelId = generateFunnelId(f.pic);
            });

            logActivity('System initialized');
            updateNavVisibility();
            // Baca menu: prioritas hash > ?menu= > default 'update'
            const validMenus = ['input', 'update', 'monitoring', 'control'];
            const hash = window.location.hash.replace('#', '');
            const urlParams = new URLSearchParams(window.location.search);
            const menuParam = urlParams.get('menu');
            const initialMenu = validMenus.includes(hash) ? hash
                : validMenus.includes(menuParam) ? menuParam
                    : 'update';
            populateMonitoringFilters();
            renderMonitoring();
            document.querySelector('[data-menu="monitoring"]')?.classList.add('active');
            console.log('Sales Management System - Intan Pariwara 2026 initialized');
            console.log('Current Week:', currentWeekLabel);
            console.log('Funnel entries:', funnelData.length);
            console.log('Weekly updates:', weeklyUpdates.length);
        }
        // Run on load
        document.addEventListener('DOMContentLoaded', init);
        // ===== NAVBAR HTMX HANDLER =====
        document.addEventListener('htmx:afterSwap', function (evt) {
            if (evt.target.id !== 'navbar-container') return;
            const goProto = document.getElementById('btn-go-prototype');
            if (goProto) goProto.classList.add('hidden');
            // Pastikan Dashboard button selalu visible
            const navDb = document.getElementById('nav-dashboard');
            if (navDb) navDb.classList.remove('hidden');
            if (typeof updateNavVisibility === 'function') updateNavVisibility();
        });
    </script>
