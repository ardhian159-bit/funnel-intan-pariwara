        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            opacity: 0;
            animation: fadeIn .8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        @keyframes sectionFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .section-fade-in {
            animation: sectionFadeIn 0.25s ease forwards;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .badge {
            padding: .25rem .5rem;
            border-radius: 9999px;
            font-size: .75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: .25rem;
        }

        .badge-deal {
            background: rgba(34, 197, 94, .2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, .5);
        }

        .badge-closing {
            background: rgba(132, 204, 22, .2);
            color: #a3e635;
            border: 1px solid rgba(132, 204, 22, .5);
        }

        .badge-pitching {
            background: rgba(234, 179, 8, .2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, .5);
        }

        .badge-shortlisted {
            background: rgba(249, 115, 22, .2);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, .5);
        }

        .badge-pendekatan {
            background: rgba(239, 68, 68, .2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .badge-dead {
            background: rgba(100, 116, 139, .2);
            color: #94a3b8;
            text-decoration: line-through;
            border: 1px solid rgba(100, 116, 139, .5);
        }

        .badge-100 {
            background: rgba(34, 197, 94, .2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, .5);
        }

        .badge-75 {
            background: rgba(132, 204, 22, .2);
            color: #a3e635;
            border: 1px solid rgba(132, 204, 22, .5);
        }

        .badge-50 {
            background: rgba(234, 179, 8, .2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, .5);
        }

        .badge-25 {
            background: rgba(249, 115, 22, .2);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, .5);
        }

        .badge-10 {
            background: rgba(239, 68, 68, .2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .badge-5 {
            background: rgba(239, 68, 68, .2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, .5);
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: .75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, .1);
            transition: transform .2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .2);
            border-color: #475569;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            font-size: .875rem;
            border-radius: .5rem;
            padding: .625rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 2px rgba(20, 184, 166, .3);
        }

        .nav-btn {
            padding: .5rem 1rem;
            border-radius: .5rem;
            font-size: .875rem;
            font-weight: 600;
            transition: all .2s;
            cursor: pointer;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
        }

        .nav-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #0d9488, #0ea5e9);
            color: white;
            border-color: transparent;
        }

        .status-row-deal {
            background: rgba(34, 197, 94, .05);
        }

        .status-row-closing {
            background: rgba(132, 204, 22, .05);
        }

        .status-row-pitching {
            background: rgba(234, 179, 8, .05);
        }

        .status-row-shortlisted {
            background: rgba(249, 115, 22, .05);
        }

        .status-row-pendekatan {
            background: rgba(239, 68, 68, .05);
        }

        .status-row-dead {
            background: rgba(100, 116, 139, .05);
            opacity: .7;
        }

        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: .75rem;
            font-weight: 600;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform .4s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            background: #065f46;
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .toast-error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .project-item {
            padding: .75rem 1rem;
            border: 1px solid #334155;
            border-radius: .5rem;
            cursor: pointer;
            transition: all .2s;
            background: #1e293b;
        }

        .project-item:hover {
            border-color: #14b8a6;
            background: #1e293b;
        }

        .project-item.selected {
            border-color: #14b8a6;
            background: rgba(20, 184, 166, .1);
        }

        .field-error {
            border-color: #ef4444 !important;
        }

        .error-msg {
            color: #f87171;
            font-size: .75rem;
            margin-top: .25rem;
            display: none;
        }

        @media(max-width:768px) {
            .nav-btn {
                font-size: .75rem;
                padding: .375rem .75rem;
            }
        }

        .filter-btn {
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* Custom Dropdown CSS */
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }

        .custom-select {
            position: relative;
            display: flex;
            flex-direction: column;
            border-width: 0;
            padding: 0;
            cursor: pointer;
        }

        .custom-select__trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .625rem;
            font-size: .875rem;
            color: white;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: .5rem;
        }

        .custom-options {
            position: absolute;
            display: block;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid #334155;
            border-top: 0;
            background: #1e293b;
            transition: all 0.3s;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 50;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 0 0 0.5rem 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            border-top: 1px solid #334155;
        }

        .custom-option {
            position: relative;
            display: block;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            border-bottom: 1px solid #334155;
        }

        .custom-option:hover {
            background-color: #334155;
        }

        .custom-option.selected {
            color: #14b8a6;
            background-color: #0f172a;
        }

        .custom-search {
            padding: 0.5rem;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            background: #1e293b;
            z-index: 2;
        }

        .custom-search input {
            width: 100%;
            padding: 0.375rem;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 0.25rem;
            font-size: 0.8rem;
        }

        .custom-search input:focus {
            outline: none;
            border-color: #14b8a6;
        }

        /* Modal CSS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            transform: translateY(-20px);
            transition: transform 0.3s;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        var statusList = ['Gagal','Informasi Awal','Informasi Kebutuhan','Presentasi','Peluang 50:50','Hot Prospek','Closing'];

        // auth functions → lihat assets/auth.js
        async function loadPipelineData() {
            if (CONFIG.USE_MOCK_DATA) return funnelData;
            try {
                showLoadingState(true);
                const sess = JSON.parse(sessionStorage.getItem('ip_session') || '{}');
                const data = await apiGet('getLeads', { role: sess.role || '', username: sess.username || '' });
                // Normalize Sheets data to match local format
                funnelData = data.map(d => ({
                    ...d,
                    id: d.id || d.no || 0,
                    tk: (typeof d.tk === 'number' && d.tk > 0 && d.tk <= 1) ? Math.round(d.tk * 100) : (parseInt(d.tk) || 0),
                    nilaiAnggaran: Number(d.nilaiAnggaran) || 0,
                    forecastNetto: Number(d.forecastNetto) || 0
                }));
                return funnelData;
            } catch (err) {
                showToast('Gagal memuat data: ' + err.message, 'error');
                return funnelData; // fallback to mock
            } finally {
                showLoadingState(false);
            }
        }

        async function loadTrackerData() {
            if (CONFIG.USE_MOCK_DATA) return weeklyUpdates;
            try {
                showLoadingState(true);
                const data = await apiGet('getTrackers');
                // Map Sheets fields to local weeklyUpdates format
                weeklyUpdates = data.map((d, i) => ({
                    id: d.id || (i + 1),
                    projectId: d.funnelId || '',
                    funnelId: d.funnelId || '',
                    pic: d.pic || '',
                    namaPaket: d.namaPaket || '',
                    week: d.week || '',
                    status: d.statusBaru || '',
                    forecast: d.forecastNetto || 0,
                    notes: d.notes || '',
                    adminNotes: d.adminNotes || '',
                    timestamp: d.timestamp || ''
                }));
                return weeklyUpdates;
            } catch (err) {
                showToast('Gagal memuat data tracker: ' + err.message, 'error');
                return weeklyUpdates; // fallback
            } finally {
                showLoadingState(false);
            }
        }

        var umSelectedUser = null;
        async function loadUserList() {
            const tbody = document.getElementById('um-user-table');
            if (!tbody) return;
            tbody.innerHTML = '<p class="text-slate-400 text-xs">Memuat...</p>';
            try {
                const response = await apiGet('getUsers');
                const users = response.data || [];
                if (!users.length) {
                    tbody.innerHTML = '<p class="text-slate-400 text-xs">Tidak ada user.</p>';
                    return;
                }
                tbody.innerHTML = users.map(u => `
                    <div class="flex items-center justify-between px-3 py-2 bg-slate-800 rounded-lg text-xs">
                        <div>
                            <span class="font-bold text-white">${u.username}</span>
                            <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] font-semibold
                                ${u.role === 'superadmin' ? 'bg-purple-900/50 text-purple-300' :
                                  u.role === 'admin' ? 'bg-blue-900/50 text-blue-300' :
                                  'bg-slate-700 text-slate-300'}">${u.role}</span>
                            ${u.picName ? `<span class="ml-2 text-slate-400">${u.picName}</span>` : ''}
                        </div>
                        <div class="flex gap-1">
                            <button onclick="openResetModal('${u.username}')"
                                class="px-2 py-1 bg-yellow-700/50 hover:bg-yellow-600/70 rounded text-yellow-300 font-bold">🔑</button>
                            <button onclick="confirmDeleteUser('${u.username}')"
                                class="px-2 py-1 bg-red-900/50 hover:bg-red-800/70 rounded text-red-300 font-bold">🗑</button>
                        </div>
                    </div>
                `).join('');
            } catch(err) {
                tbody.innerHTML = `<p class="text-red-400 text-xs">Error: ${err.message}</p>`;
            }
        }
        function showAddUserForm() {
            document.getElementById('um-add-form').classList.remove('hidden');
            document.getElementById('um-add-error').classList.add('hidden');
            document.getElementById('um-username').value = '';
            document.getElementById('um-password').value = '';
            document.getElementById('um-picname').value = '';
        }
        function hideAddUserForm() {
            document.getElementById('um-add-form').classList.add('hidden');
        }
        async function submitAddUser() {
            const username = document.getElementById('um-username').value.trim();
            const password = document.getElementById('um-password').value;
            const role     = document.getElementById('um-role').value;
            const picName  = document.getElementById('um-picname').value.trim().toUpperCase();
            const errEl    = document.getElementById('um-add-error');
            if (!username || !password) {
                errEl.textContent = 'Username dan password wajib diisi.';
                errEl.classList.remove('hidden');
                return;
            }
            try {
                const hashedPassword = await hashPassword(password);
                const res = await apiGet('addUser', { payload: JSON.stringify({ username, password: hashedPassword, role, picName }) });
                if (res.error) { errEl.textContent = res.error; errEl.classList.remove('hidden'); return; }
                showToast('✅ User berhasil ditambahkan');
                hideAddUserForm();
                loadUserList();
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        }
        function openResetModal(username) {
            umSelectedUser = username;
            document.getElementById('um-reset-label').textContent = 'Reset password untuk: ' + username;
            document.getElementById('um-new-password').value = '';
            document.getElementById('um-reset-error').classList.add('hidden');
            document.getElementById('um-reset-modal').classList.remove('hidden');
        }
        function closeResetModal() {
            document.getElementById('um-reset-modal').classList.add('hidden');
            umSelectedUser = null;
        }
        async function submitResetPassword() {
            const newPassword = document.getElementById('um-new-password').value;
            const errEl = document.getElementById('um-reset-error');
            if (!newPassword) {
                errEl.textContent = 'Password baru wajib diisi.';
                errEl.classList.remove('hidden');
                return;
            }
            try {
                const hashedNew = await hashPassword(newPassword);
                const res = await apiGet('updateUser', { payload: JSON.stringify({ username: umSelectedUser, password: hashedNew }) });
                if (res.error) { errEl.textContent = res.error; errEl.classList.remove('hidden'); return; }
                showToast('✅ Password berhasil direset');
                closeResetModal();
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        }
        async function confirmDeleteUser(username) {
            if (!confirm(`Hapus user "${username}"? Tindakan ini tidak bisa dibatalkan.`)) return;
            try {
                const res = await apiGet('deleteUser', { payload: JSON.stringify({ username }) });
                if (res.error) { showToast('Error: ' + res.error, 'error'); return; }
                showToast('✅ User berhasil dihapus');
                loadUserList();
            } catch(err) {
                showToast('Error: ' + err.message, 'error');
            }
        }

        function renderControlPanel() {
            loadUserList();
            renderUserList();
            loadDropdownEditor();
            renderActivityLog();
            populateResetSelects();
        }
        function renderUserList() {
            const cont = document.getElementById('cp-user-list');
            if (!cont) return;
            cont.innerHTML = picNames.map(n =>
                `<div class="flex justify-between items-center py-1.5 px-2 rounded hover:bg-slate-700/50 text-sm text-slate-300">
        <span>${n}</span>
        <button onclick="removeSalesUser('${n}')" class="text-red-400 hover:text-red-300 text-xs">✕</button>
    </div>`
            ).join('');
        }
        function addSalesUser() {
            const inp = document.getElementById('cp-new-user');
            const name = inp.value.trim().toUpperCase();
            if (!name) return;
            if (picNames.includes(name)) { showToast('Nama sudah ada!', 'error'); return; }
            picNames.push(name);
            saveSettingsToSheets();
            inp.value = '';
            renderUserList();
            logActivity('Added sales user: ' + name);
            showToast('User ' + name + ' ditambahkan');
        }
        function removeSalesUser(name) {
            picNames = picNames.filter(n => n !== name);
            saveSettingsToSheets();
            renderUserList();
            logActivity('Removed sales user: ' + name);
            showToast('User ' + name + ' dihapus');
        }
        function loadDropdownEditor() {
            const sel = document.getElementById('cp-dropdown-select')?.value;
            const cont = document.getElementById('cp-dropdown-items');
            if (!cont || !sel) return;
            let items = [];
            if (sel === 'picNames') items = picNames;
            else if (sel === 'principals') items = principals;
            else if (sel === 'sumberDanaList') items = sumberDanaList;
            cont.innerHTML = items.map((it, i) =>
                `<div class="flex justify-between items-center py-1 px-2 rounded hover:bg-slate-700/50 text-xs text-slate-300">
        <span>${it}</span>
        <button onclick="removeDropdownItem('${sel}',${i})" class="text-red-400 hover:text-red-300">✕</button>
    </div>`
            ).join('');
        }
        function addDropdownItem() {
            const sel = document.getElementById('cp-dropdown-select')?.value;
            const inp = document.getElementById('cp-dropdown-new');
            const val = inp.value.trim();
            if (!val || !sel) return;
            if (sel === 'picNames') picNames.push(val.toUpperCase());
            else if (sel === 'principals') principals.push(val);
            else if (sel === 'sumberDanaList') sumberDanaList.push(val);
            inp.value = '';
            loadDropdownEditor();
            logActivity('Added dropdown item to ' + sel + ': ' + val);
            showToast('Item ditambahkan');
        }
        function removeDropdownItem(listName, idx) {
            if (listName === 'picNames') picNames.splice(idx, 1);
            else if (listName === 'principals') principals.splice(idx, 1);
            else if (listName === 'sumberDanaList') sumberDanaList.splice(idx, 1);
            loadDropdownEditor();
            logActivity('Removed dropdown item from ' + listName);
            showToast('Item dihapus');
        }
        function fillSelect(id, items, placeholder, placeholderValue) {
            var el = document.getElementById(id);
            if (!el) return;
            placeholderValue = placeholderValue !== undefined ? placeholderValue : '';
            el.innerHTML = '<option value="' + placeholderValue + '">' + placeholder + '</option>';
            items.forEach(function(item) {
                el.innerHTML += '<option value="' + item + '">' + item + '</option>';
            });
        }
        function populateResetSelects() {
            fillSelect('cp-reset-user', picNames, '-- Pilih Sales --');
            const projNames = funnelData.map(f => f.id + '|' + f.namaPaket);
            const sel = document.getElementById('cp-reset-project');
            if (sel) {
                sel.innerHTML = '<option value="">-- Pilih Project --</option>';
                funnelData.forEach(f => {
                    const
                        o = document.createElement('option'); o.value = f.id; o.textContent = f.namaPaket; sel.appendChild(o);
                });
            }
        }
        function resetSubmissionFlag() {
            const user = document.getElementById('cp-reset-user')?.value;
            const projId = parseInt(document.getElementById('cp-reset-project')?.value);
            if (!user || !projId) { showToast('Pilih Sales dan Project terlebih dahulu', 'error'); return; }
            weeklyUpdates = weeklyUpdates.filter(u => !(u.pic === user && u.projectId === projId && u.week === currentWeekLabel));
            logActivity('Reset submission flag: ' + user + ' project ID ' + projId + ' week ' + currentWeekLabel);
            showToast('✅ Submission flag direset untuk ' + user);
        }

        function renderActivityLog() {

            class="text-teal-400 font-semibold">[${a.role}]</span> ${a.action}</div>`
            ).join('') : '<p class="text-slate-500 italic">Belum ada aktivitas</p>';

        // ============================================================
function logout() {
            currentSession = { role: null, username: null };
            currentRole = null;
            sessionStorage.removeItem('ip_session');
            showToast('👋 Berhasil logout!', 'success');
            window.location.href = 'admin.html';
        }
        async function init() {
            // Session guard - redirect to admin.html if no session
            if (!sessionStorage.getItem('ip_session')) {
                window.location.href = 'admin.html';
                return;
            }
            // Warmup Apps Script — eliminasi cold start
            apiGet('ping').catch(function() {});
            // Restore session dari sessionStorage (misal: back dari dashboard.html)
            const savedSession = sessionStorage.getItem('ip_session');
            if (savedSession) {
                try {
                    const parsed = JSON.parse(savedSession);
                    currentSession = parsed;
                    currentRole = parsed.role;
                } catch(e) {
                    sessionStorage.removeItem('ip_session');
                }
            }
            // Guard: harus login dulu
            if (!currentRole) {
                window.location.href = 'admin.html';
                return;
            }
            // Sales tidak boleh akses prototype
            if (currentRole === 'sales') {
                window.location.href = 'sales.html';
                return;
            }

            // Show connection status indicator
            updateConnectionStatus();

            // If live, clear mock data and load from Sheets
            try {
    const settings = await apiGet('getSettings');
    if (settings.picNames?.length)   picNames = settings.picNames;
    if (settings.principals?.length) principals = settings.principals;
    if (settings.sumberDana?.length) sumberDanaList = settings.sumberDana;
} catch(e) {
    console.warn('Gagal load settings:', e);
}
            if (!CONFIG.USE_MOCK_DATA) {
                weeklyUpdates = [];
                funnelData = [];
                try {
                    await loadPipelineData();
                    await loadTrackerData();
                } catch (err) {
                    showToast('Gagal memuat data awal: ' + err.message, 'error');
                }
            }

            // Backfill mock Funnel IDs
            funnelData.forEach(f => {
                if (!f.funnelId) f.funnelId = generateFunnelId(f.pic);
            });

            logActivity('System initialized');
            updateNavVisibility();
            // Render control panel directly
            renderControlPanel();
            populateResetSelects();
            renderActivityLog();
            document.querySelector('[data-menu="control"]')?.classList.add('active');
            console.log('Sales Management System - Intan Pariwara 2026 initialized');
            console.log('Current Week:', currentWeekLabel);
            console.log('Funnel entries:', funnelData.length);
        console.log('Weekly updates:', weeklyUpdates.length);
        }
        // Run on load
        document.addEventListener('DOMContentLoaded', init);

        document.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.target.id !== 'navbar-container') return;
    const goProto = document.getElementById('btn-go-prototype');
    if (goProto) goProto.classList.add('hidden');
    // Pastikan Dashboard button selalu visible
    const navDb = document.getElementById('nav-dashboard');
    if (navDb) navDb.classList.remove('hidden');
    if (typeof updateNavVisibility === 'function') updateNavVisibility();
        });
